name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install "mcp>=1.0.0" "httpx>=0.27.0" "pytest>=8.0.0" "pytest-asyncio>=0.23.0"
      - name: Compile
        run: python -m py_compile starlink-mcp-server.py
      - name: Test
        run: python -m pytest
