<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d">
  <title id="t">How the Starlink Enterprise MCP server works</title>
  <desc id="d">An MCP client talks to the server over stdio. The server exchanges your service account's client ID and secret for an access token at the Starlink Enterprise API's auth endpoint, caches it until it expires, and reuses it for every call. Twelve read-only tools cover terminals, service lines, addresses and the account.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6ebf5; }
    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes tok1 { 0%,5.00% { opacity: 0; } 8.00%,42.00% { opacity: 1; } 45.00%,100% { opacity: 0; } } .tok1 { animation: tok1 10.0s infinite; }
    @keyframes tok2 { 0%,45.00% { opacity: 0; } 48.00%,95.00% { opacity: 1; } 98.00%,100% { opacity: 0; } } .tok2 { animation: tok2 10.0s infinite; }
    @keyframes pa { 0%,6.00% { transform: translate(0,0); opacity: 0; } 7.00% { opacity: 1; } 17.00% { transform: translate(0px,-70px); opacity: 1; } 19.00%,100% { transform: translate(0px,-70px); opacity: 0; } } .pa { animation: pa 10.0s infinite; }
    @keyframes pb { 0%,22.00% { transform: translate(0,0); opacity: 0; } 23.00% { opacity: 1; } 33.00% { transform: translate(250px,0px); opacity: 1; } 35.00%,100% { transform: translate(250px,0px); opacity: 0; } } .pb { animation: pb 10.0s infinite; }
    @keyframes pc { 0%,50.00% { transform: translate(0,0); opacity: 0; } 51.00% { opacity: 1; } 61.00% { transform: translate(250px,0px); opacity: 1; } 63.00%,100% { transform: translate(250px,0px); opacity: 0; } } .pc { animation: pc 10.0s infinite; }
    @keyframes pd { 0%,70.00% { transform: translate(0,0); opacity: 0; } 71.00% { opacity: 1; } 81.00% { transform: translate(250px,0px); opacity: 1; } 83.00%,100% { transform: translate(250px,0px); opacity: 0; } } .pd { animation: pd 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tok1 { opacity: 0; } }
  </style>
  <rect width="960" height="460" rx="20" fill="#0f1420"/>
  <text x="30" y="52" font-size="28" font-weight="800">How it works</text>
  <text x="30" y="78" font-size="15" class="muted">One service account, one cached token, twelve read-only tools.</text>

  <rect x="30" y="170" width="170" height="64" rx="12" fill="#161d2b" stroke="#2c3750"/>
  <text x="115" y="198" text-anchor="middle" font-size="14" font-weight="700">Claude</text>
  <text x="115" y="218" text-anchor="middle" font-size="11" class="muted">or any MCP client</text>
  <path d="M200 202 H300" stroke="#3ec7ff" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/>
  <text x="250" y="192" text-anchor="middle" font-size="11" class="muted mono">stdio</text>

  <rect x="300" y="160" width="230" height="84" rx="14" fill="#1d2536" stroke="#3ec7ff" stroke-width="2.5"/>
  <text x="415" y="192" text-anchor="middle" font-size="14" font-weight="800">starlink-mcp-server.py</text>
  <text x="415" y="212" text-anchor="middle" font-size="11" class="muted">Python · httpx · MCP</text>
  <g class="tok1"><rect x="340" y="222" width="150" height="16" rx="8" fill="#2d2512"/><text x="415" y="234" text-anchor="middle" font-size="10" class="mono" style="fill:#ffd88a">getting a token…</text></g>
  <g class="tok2"><rect x="340" y="222" width="150" height="16" rx="8" fill="#123322"/><text x="415" y="234" text-anchor="middle" font-size="10" class="mono" style="fill:#9ff0c4">token cached ✓</text></g>

  <!-- auth -->
  <rect x="330" y="96" width="170" height="40" rx="10" fill="#161d2b" stroke="#ffb02e"/>
  <text x="415" y="121" text-anchor="middle" font-size="12" class="mono" style="fill:#ffd88a">POST /auth/token</text>
  <g class="pa"><circle cx="415" cy="158" r="6" fill="#ffb02e"/></g>
  <text x="510" y="114" font-size="11" class="muted">client ID + secret → access token,</text>
  <text x="510" y="130" font-size="11" class="muted">reused until it expires</text>

  <!-- api -->
  <path d="M530 202 H730" stroke="#2c3750" stroke-width="3"/>
  <g class="pb"><circle cx="540" cy="202" r="6" fill="#3ec7ff"/></g>
  <g class="pc"><circle cx="540" cy="202" r="6" fill="#3ec7ff"/></g>
  <g class="pd"><circle cx="540" cy="202" r="6" fill="#3ec7ff"/></g>
  <rect x="730" y="160" width="200" height="84" rx="14" fill="#161d2b" stroke="#e6ebf5" stroke-opacity=".5"/>
  <text x="830" y="192" text-anchor="middle" font-size="14" font-weight="800">Starlink Enterprise API</text>
  <text x="830" y="212" text-anchor="middle" font-size="10.5" class="muted mono">web-api.starlink.com</text>
  <text x="830" y="232" text-anchor="middle" font-size="10.5" class="muted">Bearer token on every call</text>

  <text x="30" y="286" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">12 TOOLS · ALL READ-ONLY: NOTHING HERE CHANGES YOUR ACCOUNT</text>
  <rect x="30" y="300" width="216" height="128" rx="12" fill="#3ec7ff" fill-opacity=".08" stroke="#3ec7ff" stroke-opacity=".55"/><text x="44" y="324" font-size="14" font-weight="700">Terminals</text><text x="232" y="325" text-anchor="end" font-size="16" font-weight="800" style="fill:#3ec7ff">4</text><text x="44" y="348" font-size="11" class="mono" style="fill:#3ec7ff">list_user_terminals</text><text x="44" y="367" font-size="11" class="mono" style="fill:#3ec7ff">get_terminal_details</text><text x="44" y="386" font-size="11" class="mono" style="fill:#3ec7ff">get_terminal_telemetry</text><text x="44" y="405" font-size="11" class="mono" style="fill:#3ec7ff">get_terminal_history</text><rect x="258" y="300" width="216" height="128" rx="12" fill="#b58cff" fill-opacity=".08" stroke="#b58cff" stroke-opacity=".55"/><text x="272" y="324" font-size="14" font-weight="700">Service lines</text><text x="460" y="325" text-anchor="end" font-size="16" font-weight="800" style="fill:#b58cff">3</text><text x="272" y="348" font-size="11" class="mono" style="fill:#b58cff">list_service_lines</text><text x="272" y="367" font-size="11" class="mono" style="fill:#b58cff">get_service_line_details</text><text x="272" y="386" font-size="11" class="mono" style="fill:#b58cff">get_data_usage</text><rect x="486" y="300" width="216" height="128" rx="12" fill="#3ddc84" fill-opacity=".08" stroke="#3ddc84" stroke-opacity=".55"/><text x="500" y="324" font-size="14" font-weight="700">Addresses</text><text x="688" y="325" text-anchor="end" font-size="16" font-weight="800" style="fill:#3ddc84">3</text><text x="500" y="348" font-size="11" class="mono" style="fill:#3ddc84">list_addresses</text><text x="500" y="367" font-size="11" class="mono" style="fill:#3ddc84">get_address_details</text><text x="500" y="386" font-size="11" class="mono" style="fill:#3ddc84">check_service_availability</text><rect x="714" y="300" width="216" height="128" rx="12" fill="#ffb02e" fill-opacity=".08" stroke="#ffb02e" stroke-opacity=".55"/><text x="728" y="324" font-size="14" font-weight="700">Account</text><text x="916" y="325" text-anchor="end" font-size="16" font-weight="800" style="fill:#ffb02e">2</text><text x="728" y="348" font-size="11" class="mono" style="fill:#ffb02e">get_account_overview</text><text x="728" y="367" font-size="11" class="mono" style="fill:#ffb02e">list_subscription_products</text>
</svg>
